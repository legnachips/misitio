<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Panadería Santa Rosa</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main>
    <div class="barra-superior">
      <a href="index.html" class="btn-volver">← Volver a la página principal</a>
      <span class="etiqueta-guia">Guía 3 · Formulario</span>
    </div>

    <div class="banner-pedidos">
      <img src="img/teto.jpg" alt="Panes artesanales Panadería Santa Rosa">
    </div>

    <h1>Haz tu pedido</h1>
    <p class="descripcion-form">Completa tus datos para reservar tus productos. Todos los campos obligatorios te avisarán si necesitan corrección.</p>

    <form action="#" novalidate>

      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ej. María Mendoza" required aria-describedby="error-nombre">
      <p class="error" id="error-nombre"></p>

      <label for="celular">Celular</label>
      <input type="tel" id="celular" name="celular" placeholder="Ej. 987 654 321" required aria-describedby="error-celular">
      <p class="error" id="error-celular"></p>

      <label for="producto">Producto</label>
      <select id="producto" name="producto" required aria-describedby="error-producto">
        <option value="">-- Elige un producto --</option>
        <option value="Pan de yema">Pan de yema (S/ 0.50)</option>
        <option value="Pan francés">Pan francés (S/ 0.40)</option>
        <option value="Empanada de carne">Empanada de carne (S/ 4.50)</option>
        <option value="Torta de chocolate">Torta de chocolate (S/ 35.00)</option>
      </select>
      <p class="error" id="error-producto"></p>

      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" min="1" max="100" placeholder="Ej. 10" required aria-describedby="error-cantidad">
      <p class="error" id="error-cantidad"></p>

      <label for="fecha">Fecha de recojo</label>
      <input type="date" id="fecha" name="fecha" required aria-describedby="error-fecha">
      <p class="error" id="error-fecha"></p>

      <label for="indicaciones">Indicaciones adicionales (opcional)</label>
      <textarea id="indicaciones" name="indicaciones" maxlength="200" rows="3" placeholder="Ej. Pan bien dorado o corte en mitades..." aria-describedby="contador-indicaciones"></textarea>
      <p id="contador-indicaciones">Te quedan 200 caracteres</p>

      <div class="campo-checkbox">
        <input type="checkbox" id="consentimiento" name="consentimiento" required aria-describedby="error-consentimiento">
        <label for="consentimiento">Autorizo el uso de mis datos únicamente para coordinar y entregar este pedido.</label>
      </div>
      <p class="error" id="error-consentimiento"></p>

      <div id="estado" role="status"></div>

      <div id="contenedor-volver-inicio" class="oculto">
        <a href="index.html" class="btn-secundario-volver">← Volver a la página principal (Guía 3)</a>
      </div>

      <div class="grupo-botones-form">
        <button type="submit">Enviar pedido</button>
        <a href="index.html" class="btn-cancelar-volver">Volver al inicio</a>
      </div>
    </form>
  </main>
</body>
</html>
