<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Panadería Santa Rosa</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/app.js" defer></script>
</head>
<body>
      <a href="../index.html" class="btn-cancelar-volver">Volver al inicio</a>

  <header class="cabecera">
    <img src="img/panaderia-banner.svg" alt="Banner ilustrado de Panadería Santa Rosa" class="banner-img">
    <nav class="barra-nav" aria-label="Navegación principal">
      <a href="index.html" class="nav-link">← Volver a la canasta (Guía 4)</a>
      <a href="pedidos.html" class="nav-link activo">Formulario de pedidos (Guía 3)</a>
    </nav>
  </header>

  <main>
    <h1>Confirmar datos de pedido</h1>
    <form action="#" novalidate>
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required aria-describedby="error-nombre">
      <p class="error" id="error-nombre"></p>

      <label for="celular">Celular</label>
      <input type="tel" id="celular" name="celular" required aria-describedby="error-celular">
      <p class="error" id="error-celular"></p>

      <label for="producto">Producto principal</label>
      <select id="producto" name="producto" required aria-describedby="error-producto">
        <option value="">-- Elige un producto --</option>
        <option value="Pan de yema">Pan de yema (S/ 0.50)</option>
        <option value="Chancay">Chancay (S/ 1.20)</option>
        <option value="Empanada de carne">Empanada de carne (S/ 4.50)</option>
        <option value="Torta de chocolate">Torta de chocolate (S/ 45.00)</option>
      </select>
      <p class="error" id="error-producto"></p>

      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" min="1" max="100" required aria-describedby="error-cantidad">
      <p class="error" id="error-cantidad"></p>

      <label for="fecha">Fecha de recojo</label>
      <input type="date" id="fecha" name="fecha" required aria-describedby="error-fecha">
      <p class="error" id="error-fecha"></p>

      <label for="indicaciones">Indicaciones adicionales (opcional)</label>
      <textarea id="indicaciones" name="indicaciones" maxlength="200" aria-describedby="contador-indicaciones"></textarea>
      <p id="contador-indicaciones">Te quedan 200 caracteres</p>

      <div class="campo-checkbox">
        <input type="checkbox" id="consentimiento" name="consentimiento" required aria-describedby="error-consentimiento">
        <label for="consentimiento">Autorizo el uso de mis datos únicamente para coordinar y entregar este pedido.</label>
      </div>
      <p class="error" id="error-consentimiento"></p>

      <div id="estado" role="status"></div>
      <div id="contenedor-regreso" hidden>
        <a href="index.html" class="btn-regreso-exito">← Volver a la página principal (Guía 4)</a>
      </div>

      <div class="acciones-form">
        <button type="submit">Enviar pedido</button>
        <a href="index.html" class="btn-secundario">Volver al inicio</a>
      </div>
    </form>
  </main>
</body>
</html>
